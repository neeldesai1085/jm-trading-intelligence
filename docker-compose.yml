services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/jm_trading.db}
      UPLOAD_DIR: /data/incoming
      QUOTE_REFRESH_SECONDS: ${QUOTE_REFRESH_SECONDS:-60}
      BENCHMARK_ISIN: ${BENCHMARK_ISIN:-}
      BENCHMARK_YAHOO_SYMBOL: ${BENCHMARK_YAHOO_SYMBOL:-^NSEI}
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me-1234567890}
      AUTH_ACCESS_MINUTES: ${AUTH_ACCESS_MINUTES:-20}
      AUTH_REFRESH_DAYS: ${AUTH_REFRESH_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
