name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app scripts tests
      - run: DATABASE_URL=sqlite:///./ci_migration.db APP_ENV=test AUTH_SECRET=unit-test-secret-change-me-abcdefghijklmnopqrstuvwxyz alembic upgrade head
      - run: DATABASE_URL=sqlite:///./tests/ci_test.db APP_ENV=test AUTH_SECRET=unit-test-secret-change-me-abcdefghijklmnopqrstuvwxyz pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: cd frontend && npm install --no-fund --no-audit && npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
