databases:
  - name: jm-trading-intelligence-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    databaseName: jmti
    user: jmti
    diskSizeGB: 5

services:
  - type: web
    name: jm-trading-intelligence-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: AUTH_ACCESS_MINUTES
        value: '20'
      - key: AUTH_REFRESH_DAYS
        value: '30'
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jm-trading-intelligence-db
          property: connectionString
      - key: QUOTE_REFRESH_SECONDS
        value: '60'
      - key: RATE_LIMIT_PER_MINUTE
        value: '30'
      - key: UPLOAD_DIR
        value: /tmp/jmti
