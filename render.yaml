services:
  - type: web
    name: jm-trading-intelligence-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        sync: false
      - key: QUOTE_REFRESH_SECONDS
        value: '30'
      - key: DATABASE_URL
        value: sqlite:////tmp/jm_trading.db
      - key: UPLOAD_DIR
        value: /tmp/jmti
