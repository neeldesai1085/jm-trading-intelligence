services:
  - type: web
    name: jm-trading-intelligence-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: AUTH_ACCESS_MINUTES
        value: '20'
      - key: AUTH_REFRESH_DAYS
        value: '30'
      - key: AUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: QUOTE_REFRESH_SECONDS
        value: '30'
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/jmti
